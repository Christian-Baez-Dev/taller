<section>

  <header class="border-b border-gray-300 mb-3 pb-2 flex flex-row items-center justify-between">
    <h2 class="text-2xl text-secondary">{{title()}}</h2>
    <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" [ngClass]="{'isRotate': isOpen()}" class="text-secondary fill-current icon" (click)="toggleOpen()">
      <rect width="24" height="24" fill="none" />
      <path fill-primary d="M12 14.975q-.2 0-.375-.062T11.3 14.7l-4.6-4.6q-.275-.275-.275-.7t.275-.7t.7-.275t.7.275l3.9 3.9l3.9-3.9q.275-.275.7-.275t.7.275t.275.7t-.275.7l-4.6 4.6q-.15.15-.325.213t-.375.062" />
    </svg>
  </header>
  <div class="containerDiv" [ngClass]="{'open': isOpen()}">
    @if (subtitle().length > 0) {
    <h3 class="text-md text-tertiary">{{subtitle()}}</h3>
    }

    <ng-content/>

  </div>


</section>
